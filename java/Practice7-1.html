<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>난수 10개 생성</h3>
    <hr>
    <script>
        let n = [];
        for(let i=0; i<10; i++){
            let x = Math.floor(Math.random()*100) + 1;
            n[i]=x;
            document.write(n[i]+"&nbsp;&nbsp;");
        }
        document.write("<hr>");
        let big = n[0];
        for(let i=1; i<10; i++){
            if(big<n[i]){
                big=n[i];
            }
        }
        document.write("제일 큰 수는 " + big);
        document.write("<hr>");
        let temp;
        for(let i=0; i<9; i++){
            for(let j=i+1; j<10;j++){
                if(n[i] > n[j]) {
                    temp = n[i];
                    n[i] = n[j];
                    n[j] = temp;
                }
            }
        }
        for(let i=0; i<10; i++){
            document.write(n[i]+"&nbsp;&nbsp;");
        }

    </script>
</body>
</html>

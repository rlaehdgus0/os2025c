<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        body { margin: 0; background-color: lightskyblue;}

        div {
            width: 300px;
            height: 200px;
            background-color: white;
            margin: 10px 20px 30px 40px;
            /* 상 우 좌 하 */
            padding: 20px 40px 60px; 
            /* 상 좌/우 하 */
            /* 2개일떄: 상/하 좌/우 1개일때 양방향 */
            border: 10px solid lightcoral;
            /* 층: margin > border > padding > content */
        }
    </style>
</head>
<body>
    <div>
        <img src="https://dummyimage.com/300x200/333/fff" alt="콘텐츠">
    </div>
</body>
</html>

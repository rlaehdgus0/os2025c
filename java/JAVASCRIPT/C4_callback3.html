<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <script>
        function callThreeTimes (callback){
            //중간에 응용될수 있음
            for(let i=0; i<3; i++){
                callback(i)
            }
        }

        function print (i) {
            console.log(`${i}번째 함수 호출`)
        }
        /*
        function callThreeTimes (){
            //중간에 응용될수 있음
            for(let i=0; i<3; i++){
                console.log(`${i}번째 함수 호출`)
            }
        }
        */
        callThreeTimes(print)
    </script>
</body>
</html>

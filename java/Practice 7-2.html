    <h3>문자열 분할</h3>
    <hr>
    <script>
        let s = prompt("문자열 입력");
        let ns = String(s);
        for(let i=0;i<ns.length;i++){
            if(ns[i]=="&")
                document.write("<br>");
            else{
                document.write(ns[i]);
            }
        }

<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* @keyframes ex { */
            from { font-size: 500%;} /*여기서부터터*/
            to { font-size: 100%;} /*여기에*/
        /* } */
        div.box {
            position: absolute;
            border-style: solid;
            height: 10%;
            width: 20%;
            margin : 40px;
            border-width : 30px;
            padding : 20px;
            border-color: red;
            /* background: blue; */
            box-shadow: 5px 5px 5px #A9A9A9;
            border-radius: 30px;
        }
        span{
            background: deeppink;
            color: yellow;
        }
        p{
            transition:font-size 5s;
        }
        p:hover{
            font-size: 500%;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <div class="box">
        <span>DIVDIVDIV</span>
    </div>
    <br>
    <h3 style="animation-name: ex; animation-duration: 3s; animation-iteration-count: infinite;">요것이 애니메이션션</h3>
    <br>
    <br>
    <p>adadada</p>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        @keyframes name{
            from{color:blue;}
            to{color: red;}
        }
        h3{
            animation-name: name;
            animation-duration: 0.0001s;
            animation-iteration-count: infinite;
        }
        span{
            transition:font-size 0.1s;
        }
        span:hover{
            font-size: 150%;
        }
        li:nth-child(){
            color: aqua;
        }
    </style>
</head>
<body>
    <h3>dadadasd</h3>
    <span>dajdahhasds</span>
    <ul>
        <li>asjdakdajd</li>
        <li>adhashdjksdhjk</li>
        <li>akjdhaskdhjskdjh</li>
    </ul>
</body>
</html>
